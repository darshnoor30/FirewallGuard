[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firewallguard-auditor"
version = "2.0.0"
description = "Explainable JSON and iptables-save firewall configuration auditing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Darshnoor Kaur"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]
dependencies = [
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "reportlab>=4.2,<5",
  "streamlit>=1.39,<2"
]

[project.scripts]
firewallguard = "main:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["audit_engine*", "compliance*", "dashboard*", "reports*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["audit_engine", "compliance", "reports"]

[tool.coverage.report]
show_missing = true
skip_covered = true
