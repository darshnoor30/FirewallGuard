name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q audit_engine compliance dashboard reports main.py
      - name: Static analysis
        run: ruff check .
      - name: Automated tests and coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=90
      - name: CLI smoke tests
        run: |
          python main.py sample_configs/corporate_firewall.json --fail-on high
          python main.py sample_configs/iptables_hardened.rules --format iptables --fail-on high
      - name: Dependency check
        run: python -m pip check
